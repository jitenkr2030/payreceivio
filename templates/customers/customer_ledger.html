{% extends "base/base.html" %}
{% block content %}
<h1>Ledger: {{ customer.name }}</h1>
<table class="table">
    <thead><tr><th>Date</th><th>Type</th><th>Reference</th><th class="text-end">Amount</th></tr></thead>
    <tbody>
        {% for e in entries %}
        <tr><td>{{ e.entry_date }}</td><td>{{ e.entry_type }}</td><td>{{ e.reference }}</td><td class="text-end">{{ e.amount }}</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
